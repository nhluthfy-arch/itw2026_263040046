<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Background</title>
    <style>
        body {
            background-color: antiquewhite;
            background-image: linear-gradient( red,blue,purple,yellow);
            height: 100vh;
        }
        .kotak1 {
            width: 200px;
            height: 200px;
            background-color: rgb(212, 139, 28);
            background-image: linear-gradient(yellow,green);
        }
        .kotak2 {
            width: 200px;
            height: 200px;
            background-color: rgb(212, 139, 28);
            background-image: radial-gradient(yellow,green);
        }
        .kotak3 {
            width: 200px;
            height: 200px;
            background-color: rgb(212, 139, 28);
            background-image: conic-gradient(yellow,green);
        }
    </style>
</head>
<body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
</body>
</html>

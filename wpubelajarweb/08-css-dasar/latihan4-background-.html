<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase Bangkit</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            background-color:maroon;
            color: rgb(248, 248, 255);
            text-align: center;
            background-image: linear-gradient(to bottom, rgb(15 23 42 / 90%) 50%,rgb(15 23 42 / 40%)), url("https://picsum.photos/id/10/1000/1000");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            
        }

        h1 {
            font-size: 4em;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            /* text-shadow: 3px 3px 0px #b0b0b0; */
            text-decoration: none;
            background-image: linear-gradient(to right,rgb(34, 163, 255)20%,rgb(238, 80, 233));
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgb(102, 222, 249, 0.5));
        }

        .quote {
            font-size: 1.2rem;
            line-height: 2;
            margin-bottom: 30px;
            background-color: rgb(255 255 255 / 5%);
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgb(255 255 255 / 10%);
            box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
        }

        .author {
            font-size: 12px;
            line-height: 2;
            color: rgb(119 119 119 / 100%);
            letter-spacing: 2px;
            font-weight: normal;
            text-transform: uppercase;
            border-top: 1px solid rgb(255 255 255 / 20%);
            width: 30%;
            margin:30px auto;
            padding-top: 20px;
        }
        span {
            color: rgb(231, 7, 7);
            text-decoration: none;
            text-shadow: 0 0 10px rgb(220 20 60 / 80%)
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FASE BANGKIT</h1>

        <div class="quote">
            <p>"Kadang kita <span>menyerah</span> hanya butuh istirahat sejenak.</p>
            <p>Melangkah lagi meski pelan dan ragu.</p>
            <p>Sebab hari esok selalu punya cerita baru."</p>
        </div>

        <p class="author">— Hindia</p>
    </div>

</body>
</html>

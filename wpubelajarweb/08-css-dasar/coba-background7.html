<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>multiple background</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background-color: #333;
        }
        .frame {
            width: 400px;
            height: 400px;
            border: 10px solid white;
            margin: auto;
            background-image: url(font/img/daniel.jpg),url(font/img/luthfycaesar.jpg),url(font/img/sabrina.jpg);
            background-size: 320px, 350px, 700px;
            background-repeat: no-repeat, no-repeat, no-repeat;
            background-position: center bottom, center 70%, bottom left;
            background-color: #f0f0f0;
            border-radius: 50%;
        }
        h1 {
            color: white;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 40px;
            text-shadow: 2px 2px 4px black;
        }

    </style>
</head>
<body>
<h1>my profile card</h1>    
<div class="frame"></div>
</body>
</html>

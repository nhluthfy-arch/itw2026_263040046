<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase Bangkit</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            background-color: #f9f9f9;
            color: #222;
            text-align: center;
            
        }

        h1 {
            font-size: 48px;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            text-shadow: 3px 3px 0px #b0b0b0;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: #555;
        }

        .quote {
            font-size: 1.2rem;
            line-height: 2;
            margin-bottom: 30px;
        }

        .author {
            font-size: 12px;
            line-height: 2;
            color: #777;
            letter-spacing: 2px;
            font-weight: normal;
        }
        span {
            color: rgb(182, 179, 179);
            text-decoration: line-through;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FASE BANGKIT</h1>

        <div class="quote">
            <p>"Kadang kita <span>menyerah</span> hanya butuh istirahat sejenak.</p>
            <p>Melangkah lagi meski pelan dan ragu.</p>
            <p>Sebab hari esok selalu punya cerita baru."</p>
        </div>

        <p class="author">— Hindia</p>
    </div>

</body>
</html>

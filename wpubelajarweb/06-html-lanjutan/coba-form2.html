<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Input Atribut, checkbox, dan radio </title>
</head>
<body>
    <h1>Contoh Input Atribut, checkbox, dan radio</h1>
    <form>
        <label for="nama">Nama:
            <input type="text" name="nama" id="nama" placeholder="Masukkan Nama Anda"autovcomplete="off" autofocus required>
        </label>
        <br>
        <h3>Hobi</h3>
        <label>
            <input type="checkbox" name="hobi1" value="membaca"> Membaca
        </label>
        <label>
            <input type="checkbox" name="hobi2" value="menulis"> Menulis
        </label>
        <label>
            <input type="checkbox" name="hobi3" value="bersepeda"> Bersepeda
        </label>

        <br>
        <h3>Radio Button</h3>
        <label>
            <input type="radio" name="gender" value="laki-laki"> Laki-laki
        </label>
        <label>
            <input type="radio" name="gender" value="perempuan"> Perempuan
        </label>

        <br>
        <button type="submit">Kirim</button>

    </form>
</body>
</html>
